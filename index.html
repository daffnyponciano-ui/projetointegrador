<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utensílios Recicláveis</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      max-width: 800px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .card-header {
      padding: 24px;
      text-align: center;
      background-color: #2e7d32;
      color: #ffffff;
    }

    .card-header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .card-header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    /* Mantém a proporção 16:9 responsiva para o iframe */
    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .card-content {
      padding: 24px;
    }

    .card-content h2 {
      font-size: 1.2rem;
      color: #1b5e20;
      margin-bottom: 10px;
    }

    .card-content p {
      line-height: 1.6;
      color: #555;
    }
  </style>
</head>
<body>

  <main class="card">
    <header class="card-header">
      <h1>Utensílios Recicláveis</h1>
      <p>Transformando o descarte em soluções sustentáveis</p>
    </header>

    <div class="video-container">
      <!-- Substitua a URL abaixo pelo link de incorporação do seu vídeo -->
      <iframe 
        src="https://www.youtube.com/embed/ID_DO_SEU_VIDEO" 
        title="Vídeo sobre utensílios recicláveis"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <article class="card-content">
      <h2>Sobre o projeto</h2>
      <p>
        Neste vídeo, apresentamos como materiais recicláveis podem ser reutilizados para a criação de utensílios práticos para o dia a dia, ajudando a reduzir o impacto ambiental e promovendo a sustentabilidade.
      </p>
    </article>
  </main>

</body>
</html>
